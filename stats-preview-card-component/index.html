<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca:wght@400&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Stats preview card component</title>

</head>
<body>
  <div class="card">
    <div class="text">
      <h1>Get <span>insights</span> that help your business grow.</h1>
      <p class="descrip">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
      <section class="stat">
        <div class="companies">
          <p>10k+</p>
          <p>companies</p>
        </div>
        <div class="templates">
          <p>314</p>
          <p>templates</p>
        </div>
        <div class="queries">
          <p>12M+</p>
          <p>queries</p>
        </div>
      </section>
    </div>
    <div class="image-container">
      <picture>
        <source media="(max-width: 768px)" srcset="./images/image-header-mobile.jpg">
        <img src="./images/image-header-desktop.jpg" alt="image-header">
      </picture>
      <div class="overlay"></div>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
