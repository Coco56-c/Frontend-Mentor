<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <div class="card">
    <picture class="bouteil">
      <source srcset="./images/image-product-mobile.jpg" media="(max-width: 600px)">
      <img src="./images/image-product-desktop.jpg" alt="perfume chanel">
    </picture>
    <div class="description">
      <p class="perfume">PERFUME</p>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>
      <div class="price">
        <p class="prix"><strong>$149.99</strong></p>
        <p class="oldprice"><s>$169.99</s></p>
      </div>

      <button class="addcard"><img src="./images/icon-cart.svg" alt="logo caddie" class="panier">Add to Cart</button>
    </div>
  </div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Crocq Corentin</a>.
  </div>
</body>
</html>
