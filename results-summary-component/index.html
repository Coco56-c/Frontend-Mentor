<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <div class="card">
    <div class="card-resultat">
      <h3>Your Result</h3>
      <div class="circle">
        <p>76</p>
        <p class="cent test">of 100</p>
      </div>
      <h3 class="great">Great</h3>
    <p class="com">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    
    <div class="card-sommaire">
      <h3>Summary</h3>
      <div class="place">
        <div class="reaction jauge">
          <div class="jauge-left">
            <img src="./images/icon-reaction.svg" alt="eclair-logo">
            <h4>Reaction</h4>
          </div>
          <div class="jauge-right">
            <p>80</p>
            <p class="cent">/ 100</p>
          </div>
        </div>
        <div class="memory jauge">
          <div class="jauge-left">
            <img src="./images/icon-memory.svg" alt="brain-logo">
            <h4>Memory</h4>
          </div>
          <div class="jauge-right">
            <p>92</p>
            <p class="cent">/ 100</p>
          </div>
        </div>
        <div class="verbal jauge">
          <div class="jauge-left">
            <img src="./images/icon-verbal.svg" alt="bulle-conversation-logo">
            <h4>Verbal</h4>
          </div>
          <div class="jauge-right">
            <p>61</p>
            <p class="cent">/ 100</p>
          </div>
        </div>
        <div class="visual jauge">
          <div class="jauge-left">
            <img src="./images/icon-visual.svg" alt="eyes-logo">
            <h4>Visual</h4>
          </div>
            <div class="jauge-right">
            <p>73</p>
          <p class="cent">/ 100</p>
          </div>
        </div>
      </div>
      <button>Continue</button>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Coco56-c">Crocq Corentin</a>.
  </div>
</body>
</html>
