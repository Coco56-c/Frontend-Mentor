<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Fylo data storage component</title>

</head>
<body>
  <div class="card">
  <div class="upload">
    <div class="logo">
      <img src="./images/logo.svg" alt="logo fylo">
    </div>
    <div class="icon">
  <div class="circle">
      <img src="./images/icon-document.svg" alt="icon-document">
    </div>
    <div class="circle">
      <img src="./images/icon-folder.svg" alt="icon-folder">
    </div>
    <div class="circle">
      <img src="./images/icon-upload.svg" alt="icon-upload">
    </div>
  </div>
  </div>

  <div class="storage">
    <label for="storage">You’ve used <span>815 GB</span> of your storage</label>
    <input type="range" id="storage" min="0" max="1000" value="815" disabled>
    <div class="limits">
      <span>0 GB</span>
      <span>1000 GB</span>
    </div>
    <div class="bubble">
      <span class="big">185</span>
      <span class="small">GB LEFT</span>
    </div>
  </div>
</div>


  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Coco56-c">Crocq Corentin</a>.
  </div>
</body>
</html>
