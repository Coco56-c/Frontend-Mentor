<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Age calculator app</title>

</head>
<body>
  <div class="card">
    <div class="birthday">
      <div class="day inputtype">
        <label for="day">Day</label>
        <input type="text" id="day" minlength="2" maxlength="2" placeholder="DD" required>
        <span>This field is required</span>
        <span>Must be a valid day</span>
        <span>Must be a valid date</span>
      </div>
      <div class="month inputtype">
        <label for="month">Month</label>
        <input type="text" id="month" minlength="2" maxlength="2" placeholder="MM" required>
        <span>This field is required</span>
        <span>Must be a valid month</span>
      </div>
      <div class="years inputtype">
        <label for="years">Year</label>
        <input type="text" id="years" minlength="4" maxlength="4" placeholder="YYYY" required>
        <span>This field is required</span>
        <span>Must be in the past</span>
      </div>
    </div>
    <div class="separation">
      <hr />
      <button><img src="./images/icon-arrow.svg" alt="icon-arrow"></button>
    </div>
    <div class="resultat">
      <p><span>--</span> years</p>
      <p><span>--</span> months</p>
      <p><span>--</span> days</p>
    </div>
  </div>
  <script src="./script.js"></script>  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Coco56-c">Crocq Corentin</a>.
  </div>
</body>
</html>
