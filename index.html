<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frontend Mentor - Coco56</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #1f1f1f;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            color: #ccc;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .project {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .project-preview {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #ddd;
        }

        .project-content {
            padding: 20px;
        }

        .project h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .project a {
            display: inline-block;
            padding: 10px 16px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .project a:hover {
            background: #5148d8;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Frontend Mentor</h1>
    <p>Mes projets Frontend Mentor</p>
</header>

<main class="container">

    <section class="projects">

        <!-- Les projets seront ajoutés automatiquement ici -->

        <article class="project">
            <img
                class="project-preview"
                src="./clipboard-landing-page/preview.jpg"
                alt="Clipboard Landing Page"
            >

            <div class="project-content">
                <h2>Clipboard Landing Page</h2>

                <a href="./clipboard-landing-page/">
                    Voir le projet
                </a>
            </div>
        </article>

        <article class="project">
            <img
                class="project-preview"
                src="./weather-app/preview.jpg"
                alt="Weather App"
            >

            <div class="project-content">
                <h2>Weather App</h2>

                <a href="./weather-app/">
                    Voir le projet
                </a>
            </div>
        </article>

    </section>

</main>

<footer>
    <p>© Coco56 - Frontend Mentor</p>
</footer>

</body>
</html>
