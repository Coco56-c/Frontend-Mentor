<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Lexend+Deca:wght@100..900&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Manrope:wght@200..800&family=Overpass:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Base Apparel coming soon page</title>

</head>
<body>
  <div class="container">
    <div class="text">
      <div class="content">
          <img src="./images/logo.svg" alt="Base Apparel Logo" class="logo">
          <img src="./images/hero-mobile.jpg" alt="Hero Mobile" class="hero-mobile">
          <div class="title">
            <h1><span>We're</span> coming soon</h1>
          </div>
          <div class="description">
            <p>Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>
          </div>
        <form id="emailform" action="#" method="post" novalidate>
          <div class="input-wrapper">
            <input type="email" name="email" id="email" placeholder="Email Address" required>
            <img src="./images/icon-error.svg" alt="Error icon" class="error-icon" id="error-icon">
            <button type="submit">
              <img src="./images/icon-arrow.svg" alt="icon-arrow">
            </button>
          </div>
          <span id="error-message" class="error-message"></span>
        </form>
      </div>
    </div>
    <img src="./images/hero-desktop.jpg" alt="hero-desktop" class="hero-desktop">
  </div>
  <script src="./script.js"></script>
  <footer>
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/Coco56-c">Crocq Corentin</a>.
    </p>
  </footer>
</body>
</html>
