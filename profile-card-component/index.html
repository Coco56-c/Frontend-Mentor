<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Profile card component</title>

</head>
<body>
  <img class="top" src="./images/bg-pattern-top.svg" alt="bg-pattern-top">
  <img class="bottom" src="./images/bg-pattern-bottom.svg" alt="bg-pattern-bottom">
  <div class="card">
    <img class="bg-pattern-card" src="./images/bg-pattern-card.svg" alt="bg-pattern-card">
    <img class="image-victor" src="./images/image-victor.jpg" alt="image-victor">
    <div class="name">
      <p>Victor Crest</p>
      <p>26</p>
    </div>
    <div class="city">
      <p>London</p>
    </div>
    <hr>
    <div class="stat">
      <div>
        <p>80K</p>
        <p>Followers</p>
      </div>
      <div>
        <p>803K</p>
        <p>Likes</p>
      </div>
      <div>
        <p>1.4K</p>
        <p>Photos</p>
      </div>
    </div>
  </div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Coco56-c">Crocq Corentin</a>.
  </div>
</body>
</html>
