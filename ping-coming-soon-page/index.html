<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Manrope:wght@200..800&family=Overpass:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Ping coming soon page</title>

</head>
<body>
  <div class="container">
    <header>
      <img src="./images/logo.svg" alt="Ping Logo">
    </header>
    <main>
      <h1><span>We are launching</span> soon!</h1>
      <p>Subscribe and get notified</p>
      <form id="emailform" action="#" method="post" novalidate>
        <input type="email" name="email" id="email" placeholder="Your email address..." required>
        <button type="submit">Notify Me</button>
        <span id="error-message" class="error-message"></span>
      </form>
    </main>
    <div class="dashboard">
      <img src="./images/illustration-dashboard.png" alt="illustration-dashboard">
    </div>
    <div class="social">
      <div class="icon-wrapper"><a href="#"><i class="fa-brands fa-facebook-f"></i></i></a></div>
      <div class="icon-wrapper"><a href="#"><i class="fa-brands fa-twitter"></i></a></div>
      <div class="icon-wrapper"><a href="#"><i class="fa-brands fa-instagram"></i></a></div>     
    </div>
    <div class="copyright"><p>&copy; Copyright Ping. All rights reserved.</p></div>
  </div>
  <script src="./script.js"></script>
  <footer>
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/Coco56-c">Crocq Corentin</a>.
    </p>
  </footer>
</body>
</html>
