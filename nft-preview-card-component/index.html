<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

</head>
<body>
  <div class="card">
    <div class="image-container">
      <img class="symbole-equilibrium" src="./images/image-equilibrium.jpg" alt="symbole-equilibrium">
      <div class="overlay">
        <img src="./images/icon-view.svg" alt="eyes-logo">
      </div>
    </div>
    <h2 class="equilibrium"><a href="#">Equilibrium #3429</a></h2>
    <p class="descrip">Our Equilibrium collection promotes balance and calm.</p>
    <div class="price">
      <div class="eth"><img src="./images/icon-ethereum.svg" alt="icon-ethereum">
        <p>0.041 ETH</p>
      </div>
      <div class="time"> <img src="./images/icon-clock.svg" alt="icon-clock">
        <p>3 days left</p>
      </div>
    </div>
  <hr>
    <div class="createur">
      <img class="photo-profile" src="./images/image-avatar.png" alt="photo-profile">
      <p>Creation of <a href="#">Jules Wyvern</a></p>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Crocq Corentin</a>.
  </div>
</body>
</html>
